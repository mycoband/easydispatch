<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a7af5" />
    <title>EasyDispatch — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #1a222b;
        background: #f2f5f8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      }
      .card {
        max-width: 360px;
        background: #fff;
        border: 1px solid #d5dee8;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: #587189;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      a {
        display: inline-block;
        background: #1a7af5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 12px 18px;
        border-radius: 12px;
        min-height: 44px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>
        EasyDispatch can’t reach the network right now. Check your signal, then
        try again. Queued tech notes and time stamps will sync when you’re back
        online.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
